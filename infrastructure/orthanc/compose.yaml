name: health-it-orthanc-lab

services:
  orthanc:
    image: orthancteam/orthanc:latest

    restart: unless-stopped

    ports:
      - "4242:4242"
      - "8042:8042"

    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db
      - ./lua/autoroute.lua:/etc/orthanc/lua/autoroute.lua:ro

    environment:
      ORTHANC__NAME: InteropLabOrthanc

volumes:
  orthanc-storage:
