name: health-it-openemr-841-validation

services:

  mysql:
    image: mariadb:11.8.8@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    restart: unless-stopped

    command:
      - mariadbd
      - --character-set-server=utf8mb4

    environment:
      MYSQL_ROOT_PASSWORD: ${OPENEMR_DB_ROOT_PASSWORD}

    volumes:
      - openemr-db-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - /usr/local/bin/healthcheck.sh
        - --su-mysql
        - --connect
        - --innodb_initialized
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

    networks:
      - openemr-internal

  openemr:
    image: openemr/openemr:8.4.1@sha256:dbe329d53020a222e0a77f37c4dd1f3ac57cc9b5c7bdb92551a50cdfe1b1718a
    restart: unless-stopped

    ports:
      - "8500:80"
      - "9500:443"

    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${OPENEMR_DB_ROOT_PASSWORD}
      MYSQL_USER: ${OPENEMR_DB_USER}
      MYSQL_PASS: ${OPENEMR_DB_PASSWORD}
      OE_USER: ${OPENEMR_ADMIN_USER}
      OE_PASS: ${OPENEMR_ADMIN_PASSWORD}

    volumes:
      - openemr-site-data:/var/www/localhost/htdocs/openemr/sites
      - openemr-logs:/var/log

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --insecure
        - --location
        - --show-error
        - --silent
        - https://localhost/meta/health/readyz
      start_period: 3m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

    networks:
      - openemr-internal

networks:

  openemr-internal:
    driver: bridge

volumes:

  openemr-db-data:

  openemr-site-data:

  openemr-logs: