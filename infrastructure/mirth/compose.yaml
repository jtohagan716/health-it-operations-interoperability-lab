name: health-it-mirth-lab

services:
  mirth-db:
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MIRTH_DB_NAME}
      POSTGRES_USER: ${MIRTH_DB_USER}
      POSTGRES_PASSWORD: ${MIRTH_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - mirth-db-data:/var/lib/postgresql/data
    networks:
      - mirth-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mirth:
    image: nextgenhealthcare/connect:4.5.2@sha256:4afa295cfe7c5ffd596efee69594157fea87202e33d66bb4a98a52db4598f836
    restart: unless-stopped
    depends_on:
      mirth-db:
        condition: service_healthy
    environment:
      DATABASE: postgres
      DATABASE_URL: jdbc:postgresql://mirth-db:5432/${MIRTH_DB_NAME}
      DATABASE_USERNAME: ${MIRTH_DB_USER}
      DATABASE_PASSWORD: ${MIRTH_DB_PASSWORD}
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MAX_RETRY: "10"
      DATABASE_RETRY_WAIT: "10000"

      INTEROP_DB_URL: jdbc:postgresql://interop-db:5432/${INTEROP_DB_NAME}
      INTEROP_DB_NAME: ${INTEROP_DB_NAME}
      INTEROP_DB_USER: ${INTEROP_DB_USER}
      INTEROP_DB_PASSWORD: ${INTEROP_DB_PASSWORD}

      KEYSTORE_STOREPASS: ${MIRTH_KEYSTORE_STOREPASS}
      KEYSTORE_KEYPASS: ${MIRTH_KEYSTORE_KEYPASS}
      VMOPTIONS: -Xmx512m
    ports:
      - "${MIRTH_HTTP_PORT}:8080"
      - "${MIRTH_HTTPS_PORT}:8443"
      - "${MIRTH_MLLP_PORT}:6661"
      - "6662:6662"
    volumes:
      - mirth-appdata:/opt/connect/appdata
    networks:
      - mirth-internal

  interop-db:
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${INTEROP_DB_NAME}
      POSTGRES_USER: ${INTEROP_DB_USER}
      POSTGRES_PASSWORD: ${INTEROP_DB_PASSWORD}

    expose:
      - "5432"

    ports:
      - "55432:5432"

    volumes:
      - interop-db-data:/var/lib/postgresql/data
      - ./interop-db/init:/docker-entrypoint-initdb.d:ro

    networks:
      - mirth-internal

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  mirth-internal:
    driver: bridge

volumes:
  mirth-db-data:
  mirth-appdata:
  interop-db-data:
